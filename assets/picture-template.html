<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>主題 圖解</title>
<!--
  使用方式
  1. 複製本檔，改名「YYYY-MM-DD-HHMM 主題 圖解.html」
  2. 換掉最上面的「一句話答案」
  3. 下面五種基本圖只留用得到的，預設最多五張（重要資訊放不下就分組）；用不到的整個 <figure> 刪掉
  4. 框裡預設最多六個字；細節寫進 data-tip，滑鼠移上去（手機點一下）才浮出來
  5. 每個框、每個箭頭都要有 data-tip。箭頭的 data-tip 寫「為什麼會走到下一步」
  6. 重點卡片：一句話在 <summary>，細節在展開區
  7. 全部內嵌，不加外部字型、CDN、mermaid
-->
<style>
  :root {
    --bg: #f7f4ee; --card: #ffffff; --ink: #2a2520; --soft: #6b6259;
    --line: #ddd5c8; --a: #b5652b; --a-soft: #f6e6d8; --b: #2f6f5e; --b-soft: #e3efea;
    --tip-bg: #2a2520; --tip-ink: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1d1a17; --card: #27231f; --ink: #efe9e1; --soft: #b5aba0;
      --line: #3d3832; --a: #e3a06c; --a-soft: #3a2c21; --b: #82c4ae; --b-soft: #263832;
      --tip-bg: #efe9e1; --tip-ink: #1d1a17;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 32px 16px 80px; background: var(--bg); color: var(--ink);
    font-family: -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    font-size: 19px; line-height: 1.75;
  }
  .wrap { max-width: 860px; margin: 0 auto; }
  .answer { font-size: 30px; font-weight: 700; line-height: 1.45; margin: 0 0 6px; }
  .hint { color: var(--soft); font-size: 18px; margin: 0 0 22px; }
  figure {
    margin: 0 0 28px; background: var(--card); border: 1px solid var(--line);
    border-radius: 16px; padding: 20px;
  }
  .scroll { overflow-x: auto; }
  figure svg { width: 100%; min-width: 700px; height: auto; display: block; }
  figcaption { font-size: 20px; font-weight: 600; margin-top: 12px; }
  svg text { font-family: inherit; fill: var(--ink); pointer-events: none; }
  .box { fill: var(--card); stroke: var(--ink); stroke-width: 2; }
  .boxA { fill: var(--a-soft); stroke: var(--a); stroke-width: 2.5; }
  .boxB { fill: var(--b-soft); stroke: var(--b); stroke-width: 2.5; }
  .arrow { stroke: var(--soft); stroke-width: 2.5; fill: none; marker-end: url(#tip); }
  .hit { stroke: transparent; stroke-width: 26; fill: none; }   /* 箭頭的隱形感應區，比線粗才好指 */
  .verb { font-size: 20px; fill: var(--soft); }
  .big { font-size: 26px; font-weight: 700; }
  .mid { font-size: 22px; }
  [data-tip] { cursor: help; outline: none; }
  svg g[data-tip]:hover rect, svg g[data-tip]:focus rect { filter: brightness(0.94); stroke-width: 3.5; }
  svg g[data-tip]:hover .arrow, svg g[data-tip]:focus .arrow { stroke: var(--a); stroke-width: 3.5; }
  #tipbox {
    position: fixed; z-index: 10; max-width: 320px; padding: 12px 16px; border-radius: 12px;
    background: var(--tip-bg); color: var(--tip-ink); font-size: 18px; line-height: 1.6;
    box-shadow: 0 6px 24px rgba(0,0,0,.18); pointer-events: none; opacity: 0; transition: opacity .12s;
  }
  #tipbox.on { opacity: 1; }
  .cards { display: grid; gap: 14px; margin-bottom: 28px; }
  .cards details {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px 20px;
  }
  .cards summary { cursor: pointer; font-size: 20px; font-weight: 600; list-style: none; }
  .cards summary::-webkit-details-marker { display: none; }
  .cards summary::after { content: "  ＋"; color: var(--soft); font-weight: 400; }
  .cards details[open] summary::after { content: "  －"; }
  .cards details p { margin: 10px 0 0; color: var(--soft); }
</style>
</head>
<body>
<div class="wrap">

<svg width="0" height="0" style="position:absolute">
  <defs>
    <marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" style="fill:var(--soft)"/>
    </marker>
  </defs>
</svg>

<!-- ① 一句話答案：只看這句就要懂七成 -->
<p class="answer">一句話答案寫在這裡，越短越好。</p>
<p class="hint">滑鼠移到框或箭頭上看細節（手機點一下）；卡片點開看更多。</p>

<!-- ② 重點卡片：一句話重點，點開才有細節 -->
<div class="cards">
  <details><summary>重點一：一句話</summary><p>點開後的細節寫這裡。</p></details>
  <details><summary>重點二：一句話</summary><p>點開後的細節寫這裡。</p></details>
  <details><summary>重點三：一句話</summary><p>點開後的細節寫這裡。</p></details>
</div>

<!-- ③ 流程：先做什麼再做什麼 -->
<figure>
  <div class="scroll"><svg viewBox="0 0 760 140" role="img" aria-label="三步流程">
    <g data-tip="第一步的細節：誰做、做什麼、要多久。"><rect class="boxA" x="10" y="40" width="180" height="64" rx="12"/><text class="big" x="100" y="80" text-anchor="middle">第一步</text></g>
    <g data-tip="第二步的細節。"><rect class="box" x="290" y="40" width="180" height="64" rx="12"/><text class="big" x="380" y="80" text-anchor="middle">第二步</text></g>
    <g data-tip="完成後會得到什麼。"><rect class="boxB" x="570" y="40" width="180" height="64" rx="12"/><text class="big" x="660" y="80" text-anchor="middle">完成</text></g>
    <g data-tip="為什麼第一步做完會送去第二步。"><path class="hit" d="M196,72 L284,72"/><path class="arrow" d="M196,72 L284,72"/></g>
    <text class="verb" x="240" y="58" text-anchor="middle">送去</text>
    <g data-tip="檢查什麼、沒過會怎樣。"><path class="hit" d="M476,72 L564,72"/><path class="arrow" d="M476,72 L564,72"/></g>
    <text class="verb" x="520" y="58" text-anchor="middle">檢查</text>
  </svg></div>
  <figcaption>這張圖要講的一件事。</figcaption>
</figure>

<!-- ④ 前後對照：現在和改了之後差在哪 -->
<figure>
  <div class="scroll"><svg viewBox="0 0 760 170" role="img" aria-label="前後對照">
    <text class="mid" x="170" y="28" text-anchor="middle" style="fill:var(--soft)">現在</text>
    <g data-tip="現在的做法，細節寫這裡。"><rect class="box" x="10" y="40" width="320" height="110" rx="14"/><text class="big" x="170" y="102" text-anchor="middle">現在的做法</text></g>
    <g data-tip="從現在變成改了之後，要做什麼。"><path class="hit" d="M344,95 L414,95"/><path class="arrow" d="M344,95 L414,95"/></g>
    <text class="mid" x="590" y="28" text-anchor="middle" style="fill:var(--soft)">改了之後</text>
    <g data-tip="改了之後的做法，細節寫這裡。"><rect class="boxB" x="430" y="40" width="320" height="110" rx="14"/><text class="big" x="590" y="102" text-anchor="middle">新的做法</text></g>
  </svg></div>
  <figcaption>這張圖要講的一件事。</figcaption>
</figure>

<!-- ⑤ 組成：一個東西由哪些部分組成 -->
<figure>
  <div class="scroll"><svg viewBox="0 0 760 200" role="img" aria-label="組成">
    <rect class="boxA" x="10" y="10" width="740" height="180" rx="16"/>
    <text class="big" x="30" y="44">大東西</text>
    <g data-tip="零件一是什麼、負責什麼。"><rect class="box" x="40" y="70" width="210" height="90" rx="12"/><text class="mid" x="145" y="122" text-anchor="middle">零件一</text></g>
    <g data-tip="零件二是什麼、負責什麼。"><rect class="box" x="275" y="70" width="210" height="90" rx="12"/><text class="mid" x="380" y="122" text-anchor="middle">零件二</text></g>
    <g data-tip="零件三是什麼、負責什麼。"><rect class="box" x="510" y="70" width="210" height="90" rx="12"/><text class="mid" x="615" y="122" text-anchor="middle">零件三</text></g>
  </svg></div>
  <figcaption>這張圖要講的一件事。</figcaption>
</figure>

<!-- ⑥ 因果：為什麼會這樣（骨牌） -->
<figure>
  <div class="scroll"><svg viewBox="0 0 760 150" role="img" aria-label="因果骨牌">
    <g data-tip="原因的細節。"><rect class="box" x="20" y="30" width="56" height="100" rx="6" transform="rotate(-25 48 130)"/></g>
    <g data-tip="接著發生了什麼。"><rect class="box" x="250" y="30" width="56" height="100" rx="6" transform="rotate(-12 278 130)"/></g>
    <g data-tip="最後的結果。"><rect class="boxA" x="480" y="30" width="56" height="100" rx="6"/></g>
    <text class="mid" x="140" y="140" text-anchor="middle">原因</text>
    <text class="mid" x="370" y="140" text-anchor="middle">接著發生</text>
    <text class="mid" x="640" y="90" text-anchor="middle" style="font-weight:700">結果</text>
    <g data-tip="為什麼原因會推倒下一個。"><path class="hit" d="M110,70 L230,70"/><path class="arrow" d="M110,70 L230,70"/></g>
    <g data-tip="為什麼會變成這個結果。"><path class="hit" d="M340,70 L460,70"/><path class="arrow" d="M340,70 L460,70"/></g>
  </svg></div>
  <figcaption>這張圖要講的一件事。</figcaption>
</figure>

<!-- ⑦ 長條：多少、比誰大（寬度照比例改） -->
<figure>
  <div class="scroll"><svg viewBox="0 0 760 150" role="img" aria-label="長條比較">
    <text class="mid" x="10" y="45">甲</text>
    <g data-tip="甲的數字從哪來。"><rect class="boxA" x="60" y="22" width="560" height="34" rx="6"/></g><text class="mid" x="632" y="47">100</text>
    <text class="mid" x="10" y="105">乙</text>
    <g data-tip="乙的數字從哪來。"><rect class="boxB" x="60" y="82" width="196" height="34" rx="6"/></g><text class="mid" x="268" y="107">35</text>
  </svg></div>
  <figcaption>這張圖要講的一件事。</figcaption>
</figure>

</div>

<div id="tipbox" role="tooltip"></div>
<script>
  // 滑鼠移到有 data-tip 的框或箭頭就浮出細節；手機點一下顯示、點空白處收起
  (function () {
    var box = document.getElementById('tipbox');
    function show(el, x, y) {
      box.textContent = el.getAttribute('data-tip');
      box.classList.add('on');
      var w = box.offsetWidth, h = box.offsetHeight;
      var left = Math.min(x + 14, window.innerWidth - w - 8);
      var top = y + 18 + h > window.innerHeight ? y - h - 12 : y + 18;
      box.style.left = Math.max(8, left) + 'px';
      box.style.top = Math.max(8, top) + 'px';
    }
    function hide() { box.classList.remove('on'); }
    document.querySelectorAll('[data-tip]').forEach(function (el) {
      el.setAttribute('tabindex', '0');
      el.addEventListener('mousemove', function (e) { show(el, e.clientX, e.clientY); });
      el.addEventListener('mouseleave', hide);
      el.addEventListener('click', function (e) { e.stopPropagation(); show(el, e.clientX, e.clientY); });
      el.addEventListener('focus', function () {
        var r = el.getBoundingClientRect(); show(el, r.left + r.width / 2, r.bottom);
      });
      el.addEventListener('blur', hide);
    });
    document.addEventListener('click', hide);
  })();
</script>
</body>
</html>
